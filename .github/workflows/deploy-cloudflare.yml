name: Deploy Cloudflare Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Worker and Pages
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build app
        run: pnpm build

      - name: Deploy SDK assets to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy public/packages
            --project-name onlyoffice-embed-resource
            --branch main
            --commit-hash ${{ github.sha }}
            --commit-message "GitHub Actions ${{ github.sha }}"
            --commit-dirty=true

      - name: Keep only the latest production Pages deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          deployments="$(pnpm exec wrangler pages deployment list \
            --project-name onlyoffice-embed-resource \
            --environment production \
            --json)"
          current_id="$(printf '%s' "$deployments" | jq -r \
            --arg source "${GITHUB_SHA:0:7}" \
            '[.[] | select(.Source == $source)][0].Id // empty')"

          if [[ -z "$current_id" ]]; then
            current_id="$(printf '%s' "$deployments" | jq -r '.[0].Id // empty')"
          fi

          if [[ -z "$current_id" ]]; then
            echo "Unable to identify the current Pages deployment" >&2
            exit 1
          fi

          printf '%s' "$deployments" | jq -r \
            --arg current "$current_id" \
            '.[] | select(.Id != $current) | .Id' |
            while read -r deployment_id; do
              [[ -z "$deployment_id" ]] && continue
              pnpm exec wrangler pages deployment delete "$deployment_id" \
                --project-name onlyoffice-embed-resource \
                --force
            done

      - name: Deploy onlyoffice.agent-bridges.com Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
