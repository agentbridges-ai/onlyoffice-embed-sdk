name: SDK Package

on:
  pull_request:
    paths:
      - ".github/workflows/sdk-package.yml"
      - ".github/workflows/publish-npm.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/onlyoffice-embed-sdk/**"
      - "scripts/verify-sdk-package.mjs"
      - "src/components/onlyoffice-web-comp/**"
      - "src/app/e2e/**"
      - "tests/e2e/specs/runtime-regressions.*"
      - "tests/e2e/specs/onlyoffice-assets.*"
      - "tests/e2e/specs/onlyoffice-factory.*"
      - "types/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sdk-package.yml"
      - ".github/workflows/publish-npm.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/onlyoffice-embed-sdk/**"
      - "scripts/verify-sdk-package.mjs"
      - "src/components/onlyoffice-web-comp/**"
      - "src/app/e2e/**"
      - "tests/e2e/specs/runtime-regressions.*"
      - "tests/e2e/specs/onlyoffice-assets.*"
      - "tests/e2e/specs/onlyoffice-factory.*"
      - "types/**"
  workflow_dispatch:

concurrency:
  group: sdk-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Pack and verify external consumers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      SDK_VERIFY_REQUIRE_BUN: "1"
      SDK_VERIFY_TARBALL_DIR: ${{ runner.temp }}/verified-sdk-package

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.13.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run focused runtime regressions
        run: >-
          pnpm exec playwright test
          tests/e2e/specs/runtime-regressions.spec.ts
          tests/e2e/specs/onlyoffice-assets.spec.ts
          tests/e2e/specs/onlyoffice-factory.spec.ts

      - name: Verify SDK tarball and external consumers
        id: verify
        run: node scripts/verify-sdk-package.mjs

      - name: Upload the verified review tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: onlyoffice-embed-sdk-${{ github.sha }}
          path: ${{ steps.verify.outputs.tarball }}
          if-no-files-found: error
          retention-days: 14
